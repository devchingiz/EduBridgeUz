name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: https://edubridge.example
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      EMAIL_TRANSPORT: console

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run format:check
      - run: npm run build
      - name: Build production container
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://edubridge.example --tag edubridge:ci .
